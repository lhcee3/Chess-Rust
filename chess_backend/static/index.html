<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess-Rust</title>
<style>
:root { --ink:#17212b; --muted:#6f7c87; --paper:#f5f1e8; --panel:#fffdf8; --line:#d8d0c2; --light:#e9d8b8; --dark:#a36c4c; --accent:#d35f3e; --accent-dark:#a94229; --green:#537a5c; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 15% 10%, #fffdf8 0 14%, transparent 35%), linear-gradient(135deg,#f5f1e8 0%,#e9e1d2 100%); font-family:Georgia, 'Times New Roman', serif; }
button, select, input { font:inherit; }
button { cursor:pointer; }
.shell { width:min(1180px,100%); margin:auto; padding:34px 22px 42px; }
.topbar { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:24px; }
.eyebrow { margin:0 0 7px; color:var(--accent); font:700 11px/1.2 'Trebuchet MS',sans-serif; letter-spacing:.18em; text-transform:uppercase; }
h1 { margin:0; font-size:clamp(30px,5vw,54px); line-height:.95; font-weight:500; letter-spacing:0; }
.subtitle { max-width:320px; margin:0; color:var(--muted); font:14px/1.45 'Trebuchet MS',sans-serif; text-align:right; }
.layout { display:grid; grid-template-columns:minmax(460px,680px) 300px; gap:28px; align-items:start; }
.board-wrap { padding:12px; background:var(--panel); border:1px solid var(--line); box-shadow:0 18px 50px rgba(82,61,38,.14); }
.board { display:grid; grid-template-columns:repeat(8,1fr); width:100%; aspect-ratio:1; overflow:hidden; }
.square { position:relative; display:grid; place-items:center; border:0; padding:0; color:var(--ink); font-family:'Trebuchet MS',sans-serif; }
.square.light { background:var(--light); }.square.dark { background:var(--dark); }
.square:hover { filter:brightness(1.08); }
.square.selected { box-shadow:inset 0 0 0 4px var(--accent); }
.square.legal::after { content:""; width:20%; height:20%; border-radius:50%; background:rgba(23,33,43,.28); }
.square.capture::after { content:""; position:absolute; inset:8%; border:4px solid rgba(211,95,62,.75); border-radius:50%; }
.piece { position:relative; z-index:1; font-size:clamp(34px,7vw,70px); line-height:1; user-select:none; text-shadow:0 2px 1px rgba(0,0,0,.2); }
.piece.white { color:#fffaf0; text-shadow:0 2px 0 #745d49, 0 0 1px #3f3328; }.piece.black { color:#272626; text-shadow:0 1px 0 rgba(255,255,255,.15); }
.rank-label,.file-label { position:absolute; color:rgba(255,255,255,.72); font:700 10px/1 'Trebuchet MS',sans-serif; pointer-events:none; }
.rank-label { top:6px; left:6px; }.file-label { right:6px; bottom:5px; }.light .rank-label,.light .file-label { color:rgba(87,59,39,.68); }
.board-note { display:flex; justify-content:space-between; gap:10px; padding:10px 2px 0; color:var(--muted); font:12px 'Trebuchet MS',sans-serif; }
.sidebar { display:flex; flex-direction:column; gap:14px; }
.panel { background:rgba(255,253,248,.82); border:1px solid var(--line); padding:17px; }
.panel h2 { margin:0 0 12px; font-size:14px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
.status { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.status strong { display:block; font-size:23px; font-weight:500; }.status small { color:var(--muted); font:12px 'Trebuchet MS',sans-serif; }
.dot { width:10px; height:10px; flex:0 0 auto; border-radius:50%; background:var(--green); }.dot.thinking { background:var(--accent); animation:pulse 1s infinite; }.dot.over { background:#8f4a43; }
@keyframes pulse { 50% { opacity:.35; transform:scale(.75); } }
.moves { max-height:220px; overflow:auto; font:14px/1.7 'Trebuchet MS',sans-serif; }.move-row { display:grid; grid-template-columns:35px 1fr 1fr; border-bottom:1px solid #eee7dc; }.move-row span:first-child { color:var(--muted); }.move-row span:not(:first-child) { font-family:Georgia,serif; }.move-row .current { color:var(--accent-dark); font-weight:700; }
.empty { color:var(--muted); font-size:13px; }
.controls { display:grid; gap:10px; }.control { display:flex; align-items:center; justify-content:space-between; gap:10px; font:13px 'Trebuchet MS',sans-serif; }.control select,.control input { width:120px; padding:7px 8px; color:var(--ink); background:#fffdf8; border:1px solid var(--line); border-radius:2px; }
.btn { border:1px solid var(--accent-dark); padding:10px 14px; color:#fffdf8; background:var(--accent); font:700 12px 'Trebuchet MS',sans-serif; letter-spacing:.05em; text-transform:uppercase; }.btn:hover { background:var(--accent-dark); }.btn.secondary { color:var(--ink); background:transparent; border-color:var(--line); }.btn.secondary:hover { background:#f1eadf; }
.button-row { display:flex; gap:8px; margin-top:4px; }.button-row .btn { flex:1; }
.stats { color:var(--muted); font:12px/1.7 'Trebuchet MS',sans-serif; }.stats b { color:var(--ink); font-weight:600; }
.error { padding:9px 10px; color:#7c2e25; background:#f7ddd6; border-left:3px solid var(--accent); font:12px/1.4 'Trebuchet MS',sans-serif; }.hidden { display:none !important; }
#auth-section { display:flex; justify-content:flex-end; align-items:center; min-height:30px; gap:8px; font:12px 'Trebuchet MS',sans-serif; }
#loading { padding:20vh 20px; color:var(--muted); text-align:center; font:16px 'Trebuchet MS',sans-serif; }
@media (max-width:850px) { .shell { padding:22px 12px 28px; }.topbar { align-items:start; flex-direction:column; }.subtitle { text-align:left; }.layout { grid-template-columns:1fr; gap:16px; }.board-wrap { padding:7px; }.sidebar { display:grid; grid-template-columns:1fr 1fr; }.sidebar .panel:first-child,.sidebar .panel:last-child { grid-column:1/-1; } }
@media (max-width:520px) { .sidebar { display:flex; }.piece { font-size:clamp(28px,11vw,48px); }.board-note { font-size:11px; } }
</style>
</head>
<body>
<div id="loading">Connecting to Chess-Rust...</div>
<main id="app" class="shell hidden">
  <div id="auth-section"></div>
  <header class="topbar">
    <div><p class="eyebrow">Local chess engine</p><h1>Play the position.</h1></div>
    <p class="subtitle">A quiet board for sharp decisions. You play white; the local engine answers as black.</p>
  </header>
  <div class="layout">
    <section>
      <div class="board-wrap"><div id="board" class="board" aria-label="Chess board"></div></div>
      <div class="board-note"><span id="turn-note">Select a piece to begin</span><span>Click or drag to move</span></div>
    </section>
    <aside class="sidebar">
      <section class="panel"><div class="status"><div><strong id="status">Starting...</strong><small id="status-detail">Loading game state</small></div><span id="status-dot" class="dot"></span></div></section>
      <section class="panel"><h2>Moves</h2><div id="move-history" class="moves"><span class="empty">No moves yet</span></div></section>
      <section class="panel"><h2>Engine</h2><div id="engine-stats" class="stats">Waiting for a move.</div></section>
      <section class="panel"><h2>Game settings</h2><div class="controls">
        <label class="control"><span>Engine plays</span><select id="ai-side"><option value="black">Black</option><option value="white">White</option><option value="none">Nobody</option></select></label>
        <label class="control"><span>Search depth</span><select id="depth"><option value="4">4</option><option value="6">6</option><option value="8" selected>8</option><option value="10">10</option><option value="12">12</option></select></label>
        <label class="control"><span>Time limit</span><input id="time-limit" type="number" value="2000" min="500" max="30000" step="500"></label>
        <div class="button-row"><button id="new-game" class="btn">New game</button><button id="flip-board" class="btn secondary" title="Flip board">Flip</button></div>
        <div id="error" class="error hidden" role="alert"></div>
      </div></section>
    </aside>
  </div>
</main>
<script>
const API_BASE = '/api';
const pieces = { K:'♔', Q:'♕', R:'♖', B:'♗', N:'♘', P:'♙', k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };
let gameState = null;
let selectedSquare = null;
let boardFlipped = false;
let draggingSquare = null;
let aiRequestActive = false;
function el(id) { return document.getElementById(id); }
function apiFetch(path, options = {}) { return fetch(API_BASE + path, { ...options, headers: { 'Content-Type':'application/json', ...(options.headers || {}) } }); }
function showError(message) { const error = el('error'); error.textContent = message; error.classList.remove('hidden'); window.clearTimeout(showError.timer); showError.timer = window.setTimeout(() => error.classList.add('hidden'), 4000); }
function parseFen(fen) { const rows = fen.split(' ')[0].split('/'); const squares = {}; rows.forEach((row, rowIndex) => { let file = 0; for (const token of row) { if (/\d/.test(token)) file += Number(token); else { squares[String.fromCharCode(97 + file) + (8 - rowIndex)] = token; file++; } } }); return squares; }
function squareName(file, rank) { return String.fromCharCode(97 + file) + rank; }
function renderBoard() {
  const board = el('board'); board.innerHTML = ''; if (!gameState) return;
  const position = parseFen(gameState.fen); const files = boardFlipped ? [...Array(8).keys()].reverse() : [...Array(8).keys()]; const ranks = boardFlipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
  for (const rank of ranks) for (const file of files) { const square = squareName(file, rank); const cell = document.createElement('button'); cell.className = 'square ' + ((file + rank) % 2 ? 'dark' : 'light'); cell.dataset.square = square; if (selectedSquare === square) cell.classList.add('selected'); const legal = (gameState.legalMoves || []).filter(move => move.startsWith(selectedSquare || '') && move.slice(2, 4) === square); if (selectedSquare && legal.length) cell.classList.add(position[square] ? 'capture' : 'legal');
    if (rank === (boardFlipped ? 1 : 8)) { const label = document.createElement('span'); label.className = 'file-label'; label.textContent = square[0]; cell.appendChild(label); } if (file === (boardFlipped ? 7 : 0)) { const label = document.createElement('span'); label.className = 'rank-label'; label.textContent = square[1]; cell.appendChild(label); }
    if (position[square]) { const piece = document.createElement('span'); piece.className = 'piece ' + (position[square] === position[square].toUpperCase() ? 'white' : 'black'); piece.textContent = pieces[position[square]]; piece.draggable = true; piece.addEventListener('dragstart', event => { draggingSquare = square; event.dataTransfer.effectAllowed = 'move'; }); cell.appendChild(piece); }
    cell.addEventListener('click', () => handleSquare(square)); cell.addEventListener('dragover', event => event.preventDefault()); cell.addEventListener('drop', event => { event.preventDefault(); if (draggingSquare) tryMove(draggingSquare, square); draggingSquare = null; }); board.appendChild(cell);
  }
}
function handleSquare(square) { if (!gameState || !gameState.myTurn || gameState.status === 'checkmate' || gameState.status === 'stalemate' || aiRequestActive) return; if (selectedSquare) { if (selectedSquare === square) { selectedSquare = null; renderBoard(); return; } if (tryMove(selectedSquare, square)) return; } const piece = parseFen(gameState.fen)[square]; if (piece && ((gameState.sideToMove === 'white') === (piece === piece.toUpperCase()))) { selectedSquare = square; renderBoard(); } }
async function makeMove(uci) { try { const response = await apiFetch('/move', { method:'POST', body:JSON.stringify({ uci }) }); const data = await response.json(); if (!response.ok || !data.ok) { showError(data.error || 'That move is not legal.'); await fetchGameState(); return; } await fetchGameState(); if (gameState && !gameState.myTurn && gameState.status === 'playing') triggerAI(); } catch (error) { showError('Could not submit move.'); } }
async function triggerAI() { if (aiRequestActive) return; aiRequestActive = true; renderStatus(); try { const response = await apiFetch('/ai-move', { method:'POST' }); const data = await response.json(); if (!response.ok || data.ok === false) showError(data.error || 'The engine could not move.'); if (data.uci) updateEngineStats(data); await fetchGameState(); } catch (error) { showError('Could not reach the engine.'); } finally { aiRequestActive = false; renderStatus(); } }
async function fetchGameState() { const response = await apiFetch('/game'); if (!response.ok) throw new Error('Game unavailable'); gameState = await response.json(); el('ai-side').value = gameState.aiSide || 'none'; if (gameState.engine) { el('depth').value = gameState.engine.depth; el('time-limit').value = gameState.engine.timeLimitMs; } renderBoard(); renderStatus(); renderHistory(); }
function renderStatus() { if (!gameState) return; const over = gameState.status === 'checkmate' || gameState.status === 'stalemate'; let title = 'Your turn'; let detail = 'White to move'; if (aiRequestActive) { title = 'Engine thinking'; detail = 'Searching for a reply'; } else if (gameState.status === 'checkmate') { title = 'Checkmate'; detail = (gameState.winner || 'Unknown') + ' wins'; } else if (gameState.status === 'stalemate') { title = 'Stalemate'; detail = 'Draw'; } else if (gameState.status === 'check') { title = gameState.myTurn ? 'You are in check' : 'Check'; detail = gameState.myTurn ? 'Find a legal escape' : 'The engine is in check'; } else if (!gameState.myTurn) { title = 'Engine to move'; detail = 'Black to move'; } el('status').textContent = title; el('status-detail').textContent = detail; el('status-dot').className = 'dot ' + (aiRequestActive ? 'thinking' : over ? 'over' : ''); el('turn-note').textContent = over ? 'Game complete' : gameState.myTurn ? 'Your turn as white' : 'Waiting for the engine'; }
function renderHistory() { const history = gameState.moveHistory || []; if (!history.length) { el('move-history').innerHTML = '<span class="empty">No moves yet</span>'; return; } let html = ''; for (let i = 0; i < history.length; i += 2) html += '<div class="move-row"><span>' + (Math.floor(i / 2) + 1) + '.</span><span class="' + (i === history.length - 1 ? 'current' : '') + '">' + (history[i] || '') + '</span><span class="' + (i + 1 === history.length - 1 ? 'current' : '') + '">' + (history[i + 1] || '') + '</span></div>'; el('move-history').innerHTML = html; el('move-history').scrollTop = el('move-history').scrollHeight; }
function updateEngineStats(data) { el('engine-stats').innerHTML = '<b>Depth</b> ' + data.depth + '<br><b>Nodes</b> ' + (data.nodes || 0).toLocaleString() + '<br><b>NPS</b> ' + (data.nps || 0).toLocaleString() + '<br><b>Score</b> ' + ((data.scoreCp || 0) / 100).toFixed(2) + '<br><b>Time</b> ' + data.timeMs + ' ms'; }
async function newGame() { const body = { ai_side:el('ai-side').value, depth:Number(el('depth').value), time_limit_ms:Number(el('time-limit').value) }; const response = await apiFetch('/new-game', { method:'POST', body:JSON.stringify(body) }); if (!response.ok) { showError('Could not start a new game.'); return; } selectedSquare = null; await fetchGameState(); if (!gameState.myTurn && gameState.status === 'playing') triggerAI(); }
async function updateConfig() { await apiFetch('/config', { method:'POST', body:JSON.stringify({ ai_side:el('ai-side').value, depth:Number(el('depth').value), time_limit_ms:Number(el('time-limit').value) }) }); await fetchGameState(); if (!gameState.myTurn && gameState.status === 'playing') triggerAI(); }
function init() { el('new-game').addEventListener('click', newGame); el('flip-board').addEventListener('click', () => { boardFlipped = !boardFlipped; renderBoard(); }); el('ai-side').addEventListener('change', updateConfig); el('depth').addEventListener('change', updateConfig); el('time-limit').addEventListener('change', updateConfig); fetch('/api/health').then(response => response.json()).then(async health => { if (health.auth === 'required') { el('loading').textContent = 'This server requires Firebase sign-in, but this UI only supports local play. Restart the server without AUTH_REQUIRED to play.'; return; } el('loading').classList.add('hidden'); el('app').classList.remove('hidden'); try { await fetchGameState(); if (!gameState.myTurn && gameState.status === 'playing') triggerAI(); } catch (error) { el('app').classList.add('hidden'); el('loading').classList.remove('hidden'); el('loading').textContent = 'Could not load the game: ' + error.message; } }).catch(() => { el('loading').textContent = 'Cannot connect to server. Start the Rust backend and refresh.'; }); }
init();
</script>
</body>
</html>
