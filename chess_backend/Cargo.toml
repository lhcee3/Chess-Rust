[package]
name = "chess_backend"
version = "0.2.0"
edition = "2024"

[dependencies]
actix-web = "4.10.2"
tokio = { version = "1.45.0", features = ["full"] }
env_logger = "0.11.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dashmap = "6"
once_cell = "1.20"
rand = "0.8"
